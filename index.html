<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生日快乐 · Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&amp;family=Quicksand:wght@300;400;500;600;700&amp;family=ZCOOL+KuaiLe&amp;family=Long+Cang&amp;family=Ma+Shan+Zheng&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/intro.css">
<link rel="stylesheet" href="css/memories.css">
<link rel="stylesheet" href="css/interactive.css">
<link rel="stylesheet" href="css/finale.css">
</head>
<body class="shell">

<!-- 星空背景层 -->
<canvas id="starfield"></canvas>
<div class="atmosphere"></div>
<div class="vignette"></div>

<!-- 转场闪光 -->
<div class="transition-flash" id="transFlash"></div>

<!-- 背景音乐(file:// 相对路径加载,无需服务器) -->
<audio id="bgAudio" src="music/特别的人/特别的人.MP3" preload="auto"></audio>

<!-- ===== 场景1：开场 ===== -->
<section id="intro" class="scene active">
  <div class="intro-glow"></div>
  <h1 class="intro-title">生日快乐</h1>
  <p class="intro-subtitle">一份特别的礼物 送给特别的你</p>
  <p class="intro-hint">轻触画面 开启音乐体验</p>
</section>

<!-- ===== 场景2：回忆 ===== -->
<section id="memories" class="scene">
  <div class="s1-main-container">
    <!--
      Global Atmosphere Layers — 全视口 fixed,与 camera 完全解耦。
      渲染顺序从下到上:background → ambient → particles → effects → scene(cards) → typography → UI。
      camera transform 只作用于 .carousel-area 内的 .camera-rig,不影响背景。
    -->
    <!-- Layer 0 Background -->
    <div class="layer layer-bg" id="layerBg"></div>
    <!-- Layer 1 Ambient Light -->
    <div class="layer layer-ambient" id="layerAmbient"></div>
    <!-- Layer 2 Particles -->
    <div class="layer layer-particles" id="layerParticles"></div>
    <!-- Layer 4 Photo Effects(取代 7 个 style-decor) -->
    <div class="layer layer-effects" id="layerEffects">
      <div class="fx-grain" id="fxGrain"></div>
      <div class="fx-light-leak" id="fxLightLeak"></div>
      <div class="fx-vignette" id="fxVignette"></div>
      <div class="fx-scanlines" id="fxScanlines"></div>
      <div class="fx-stars" id="fxStars"></div>
      <div class="fx-particles" id="fxParticles"></div>
      <div class="fx-rgb-split" id="fxRgbSplit"></div>
      <div class="fx-hero-light" id="fxHeroLight"></div>
    </div>

    <div class="memories-header">
      <button class="skip-btn" id="skipBtn">跳过 →</button>
    </div>

    <div class="s1-scene">
      <div class="vinyl-area">
        <div class="vinyl-arm">
          <div class="vinyl-arm-pivot"></div>
          <div class="vinyl-arm-body"></div>
          <div class="vinyl-arm-head"></div>
        </div>
        <div class="vinyl-record">
          <div class="vinyl-center-image">
            <img id="diskCoverImg" src="" alt="光盘封面">
          </div>
        </div>
        <div class="vinyl-shadow"></div>
      </div>

      <div class="carousel-area">
        <!--
          carousel-area 只承担 Photo World(camera + cards)。
          所有氛围层已提升到 .s1-main-container 直接子级,position:fixed inset:0,
          覆盖整个视口,与 camera transform 完全解耦,左右无缝。
        -->
        <!-- Layer 3 Photo Scene(camera-rig + cards) -->
        <div class="layer layer-photo">
          <div class="camera-rig" id="cameraRig">
            <div class="memory-cards-stack" id="memoryCarousel"></div>
          </div>
        </div>
        <!-- Layer 6 UI(点击区) -->
        <div class="memory-left-zone" id="memoryLeftZone"></div>
        <div class="memory-right-zone" id="memoryRightZone"></div>
      </div>
    </div>

    <!-- Layer 5 Typography(歌词) — 在 cards 之上 -->
    <div class="layer layer-typography">
      <div class="lyrics-display">
        <p class="lyrics-text" id="lyricsText"></p>
      </div>
    </div>

    <!-- 进度条(Layer 6 UI) -->
    <div class="progress-bar">
      <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-thumb" id="progressThumb"></div>
      </div>
      <div class="time-info">
        <span id="currentTime">0:00</span>
        <span id="totalTime">4:19</span>
      </div>
    </div>
  </div>
</section>

<!-- ===== 场景3：互动 ===== -->
<section id="interactive" class="scene">
  <div class="cake-area" id="cakeArea">
    <div class="cake-plate"></div>
    <div class="cake-layer cake-bottom">
      <div class="cake-dots" id="dotsBottom"></div>
    </div>
    <div class="cake-layer cake-middle">
      <div class="cake-dots" id="dotsMiddle"></div>
    </div>
    <div class="cake-layer cake-top">
      <div class="cake-dots" id="dotsTop"></div>
    </div>
    <div class="candle-row" id="candleRow"></div>
  </div>
  <p class="interactive-hint" id="interactiveHint">点击蛋糕 闭上眼睛 许个愿望</p>
  <p class="wish-text" id="wishText">愿望已许下 一定会实现</p>
  <div class="balloon-layer" id="balloonLayer"></div>
  <div class="confetti-layer" id="confettiLayer"></div>
</section>

<!-- ===== 场景4：心形汇聚 ===== -->
<section id="finale" class="scene">
  <div class="heart-stage" id="heartStage">
    <div class="heart-glow"></div>
  </div>
  <div class="finale-message" id="finaleMessage">
    <h2>生日快乐</h2>
    <p>愿你永远被爱 永远快乐 永远闪耀</p>
  </div>
</section>

<!-- 脚本(顺序:数据 → 歌词 → 音乐控制器 → 实例化 → 视觉 → 各场景 → 路由) -->
<script src="js/images.js"></script>
<script src="music/特别的人/特别的人.lyrics.js"></script>
<script src="js/music-box.js"></script>
<script>
  // 全局音乐控制器实例,跨场景共享同一个 <audio>
  const musicBox = new MusicBox(document.getElementById('bgAudio'));
  window.musicBox = musicBox;
</script>
<script src="js/starfield.js"></script>
<script src="js/float-particles.js"></script>
<script src="js/intro.js"></script>
<script src="js/motion-scheduler.js"></script>
<script src="js/hero-director.js"></script>
<script src="js/memories.js"></script>
<script src="js/interactive.js"></script>
<script src="js/finale.js"></script>
<script src="js/router.js"></script>
</body>
</html>
